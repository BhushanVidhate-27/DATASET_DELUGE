name: Deploy to Vercel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dataset_version:
        description: 'Dataset version (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Build, Commit, and Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Determine dataset version
        id: version
        run: |
          if [ -n "${{ inputs.dataset_version }}" ]; then
            echo "version=${{ inputs.dataset_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine Vercel URL
        id: url
        run: |
          if [ -n "${{ vars.VERCEL_DOWNLOAD_BASE_URL }}" ]; then
            echo "base_url=${{ vars.VERCEL_DOWNLOAD_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://dataset-deluge.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Build database (full pipeline)
        run: pnpm build-db
        env:
          DATASET_VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ steps.url.outputs.base_url }}
          FETCH_CONCURRENCY: 4
          FETCH_DELAY_MS: 100
          FETCH_RETRIES: 5
          FETCH_RETRY_DELAY_MS: 2000
        timeout-minutes: 10

      - name: Verify generated artifacts
        run: |
          for f in pokemon.json recommendations.json evolutions.json forms.json pokemon-db.json pokemon-db.json.gz metadata.json version.json checksum.json; do
            if [ ! -f "generated/$f" ]; then
              echo "Missing generated/$f"
              exit 1
            fi
          done
          echo "All generated artifacts present"

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "chore: update dataset to v${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Trigger Vercel deployment
        run: |
          echo "✅ Generated files committed to ${{ github.ref_name || github.ref }}"
          echo "🚀 Vercel will auto-deploy from the push"
          echo "📦 Dataset will be available at: ${{ steps.url.outputs.base_url }}"
          echo ""
          echo "Files:"
          echo "  ${{ steps.url.outputs.base_url }}/pokemon-db.json.gz"
          echo "  ${{ steps.url.outputs.base_url }}/version.json"
          echo "  ${{ steps.url.outputs.base_url }}/metadata.json"
