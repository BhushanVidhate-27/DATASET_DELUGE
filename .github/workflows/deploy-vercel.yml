name: Deploy to Vercel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dataset_version:
        description: 'Dataset version (e.g. 1.2.0)'
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if Vercel secrets are configured
    if: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Determine dataset version
        id: version
        run: |
          if [ -n "${{ inputs.dataset_version }}" ]; then
            echo "version=${{ inputs.dataset_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build database (full pipeline)
        run: pnpm build-db
        env:
          DATASET_VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ vars.VERCEL_DOWNLOAD_BASE_URL || format('https://{0}.vercel.app', vars.VERCEL_PROJECT_NAME || 'deluge-db') }}
        timeout-minutes: 10

      - name: Verify generated artifacts
        run: |
          for f in pokemon.json recommendations.json evolutions.json forms.json pokemon-db.json pokemon-db.json.gz metadata.json version.json checksum.json; do
            if [ ! -f "generated/$f" ]; then
              echo "Missing generated/$f"
              exit 1
            fi
          done
          echo "All generated artifacts present"

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }}
        continue-on-error: true

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

      - name: Output deployment URL
        run: |
          echo "🚀 Dataset deployed to: ${{ steps.deploy.outputs.deploy_url }}"
          echo "📦 Files available at:"
          echo "  ${{ steps.deploy.outputs.deploy_url }}/pokemon-db.json.gz"
          echo "  ${{ steps.deploy.outputs.deploy_url }}/version.json"
          echo "  ${{ steps.deploy.outputs.deploy_url }}/metadata.json"
