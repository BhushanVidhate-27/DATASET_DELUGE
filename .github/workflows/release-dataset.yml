name: Release Dataset

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Dataset
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build database (full pipeline)
        run: pnpm build-db
        env:
          DATASET_VERSION: ${{ steps.version.outputs.version }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL || format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) }}
        timeout-minutes: 10

      - name: Verify generated artifacts
        run: |
          for f in pokemon.json recommendations.json evolutions.json forms.json pokemon-db.json pokemon-db.json.gz metadata.json version.json checksum.json; do
            if [ ! -f "generated/$f" ]; then
              echo "Missing generated/$f"
              exit 1
            fi
          done
          echo "All generated artifacts present"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dataset ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            generated/pokemon-db.json
            generated/pokemon-db.json.gz
            generated/pokemon.json
            generated/recommendations.json
            generated/evolutions.json
            generated/forms.json
            generated/metadata.json
            generated/version.json
            generated/checksum.json
